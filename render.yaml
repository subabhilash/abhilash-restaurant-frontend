# Render Blueprint for the Next.js frontend.
# Push to GitHub, then in Render dashboard:
#   New + → Blueprint → connect this repo → Apply.

services:
  - type: web
    name: admizo-frontend
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: .

    buildCommand: npm ci && npm run build
    startCommand: npm start

    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: "20"
      # Public env vars (visible in browser bundle)
      - key: NEXT_PUBLIC_API_URL
        sync: false           # https://admizo-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false           # https://admizo-backend.onrender.com
